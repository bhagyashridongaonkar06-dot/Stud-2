<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">

</head>
<body>
   <div class="container-fluid">
    <div class="row">
        <div class="col-md-4 mt-5">
            <div class="card">
                <form action="" id="stdForm">
                    <div class="card-body">
                        <h3 class="bg-primary text-center text-white">STUDENT FORM</h3>
                        <div class="form-group">
                            <label for="fname">First Name :</label>
                            <input type="text" class="form-control" id="fname">
                        </div>
                        <div class="form-group">
                            <label for="lname">Last Name :</label>
                            <input type="text" class="form-control" id="lname">
                        </div>
                        <div class="form-group">
                            <label for="email">Email :</label>
                            <input type="text" class="form-control" id="email">
                        </div>
                        <div class="form-group">
                            <label for="contact">Contact :</label>
                            <input type="text" class="form-control" id="contact">
                        </div>
                            <button type="submit" class="btn-primary btn-block btn-sm" id="addStd">Add Student</button>
                            <button type="button" class="btn-primary btn-block btn-sm d-none" id="updateStd">Update Student</button>
                    </div>
                </form>
            </div>
        </div>


        <div class="col-md-8 mt-5">
            <div class="card">
                <div class="card-body table-responsive">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>Sr No</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Email</th>
                                <th>Contact</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                        </thead>
                        <tbody id="stdList">
                            <!-- <tr>
                                <td>1</td>
                                <td>1</td>
                                <td>1</td>
                                <td>1</td>
                                <td>1</td>
                                <td><i class="fa-solid fa-pen-to-square fa-2x text-primary" role="button"></i></td>
                                <td><i class="fa-solid fa-trash fa-2x text-danger" role="button"></i></td>
                            </tr> -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
   </div> 
    








    <script src="./assets/js/app.js"></script>
</body>
</html>
